version: 1
name: novel-demo-novel
params:
  chapter_num: 1
  chapter_pad: '01'
  chapter_title: 沉默信标
  volume_name: 第一卷
  genre: 科幻悬疑
  tone: 冷峻硬核、快节奏悬疑
  target_words: 3200
  chapter_pad3: '001'
  chapter_prev_num: 1
  chapter_prev_pad: '01'
  chapter_prev_pad3: '001'
  volume_num: 1
  volume_pad: '01'
nodes:
  gather_state:
    kind: agent
    model: gemini-3.8-flash-high
    role: 小说前置状态与伏笔总账员
    prompt: '盘点本书当前的世界观规则、人物知情状态以及未回收伏笔。

      提取第 {chapter_num} 章（{chapter_title}）必须推进的核心矛盾与读者信息差要点。

      1. 输出【知情视界三栏表】：出场角色已知事实、合理推测、绝对盲区禁区（严禁上帝视角提前得知未发生剧情）；

      2. 输出【角色称谓与社交礼仪白名单】：出场角色间互称规范（发小亲昵称谓 vs 正式称谓）、严禁好莱坞式狂暴怒吼“闭嘴”、明确理性克制打断方式；

      输出简明紧凑的章节任务上下文到指定路径。'
    inputs:
    - 设定/事实账本/snapshot.json
    - 设定/世界观/
    - 设定/人物/
    - 设定/大纲/
    outputs:
    - 工作区/第{chapter_pad}章/01_状态上下文.md
    skills:
    - novel-context-curator
    assert:
      min_words: 200
  scene_beats:
    kind: agent
    after:
    - gather_state
    model: gemini-3.8-flash-high
    role: 单章分场骨架与悬念架构师
    prompt: '依据 工作区/第{chapter_pad}章/01_状态上下文.md 与 设定/大纲/ 中关于第 {chapter_num} 章剧情设定，构建本章的分场微观节拍与戏剧张力架构：

      1. 规划本章黄金开局切入点（In Medias Res，危机直接切入，杜绝交代背景）；

      2. 规划 3~4 个核心分场节拍（每个节拍严格闭环：即时目标 Goal、阻碍交锋 Conflict、恶化转折 Disaster，并标明动静幕与五感物理锚点）；

      3. 规划动静呼吸节奏交替波浪线，严控水分；

      4. 严格设计章末断章悬念钩子（从六大断章模型中选择其一并设计落幅句）。

      输出紧凑的分场节拍表到指定路径。'
    inputs:
    - 工作区/第{chapter_pad}章/01_状态上下文.md
    - 设定/大纲/
    outputs:
    - 工作区/第{chapter_pad}章/01_5_分场节拍表.md
    skills:
    - novel-scene-tension
    assert:
      min_words: 300
  draft_chapter:
    kind: agent
    after:
    - scene_beats
    model: gemini-3.8-flash-high
    role: 长篇小说主笔作家
    prompt: '你是一位顶级职业小说家。请严格对照 工作区/第{chapter_pad}章/01_5_分场节拍表.md 的分场架构与 工作区/第{chapter_pad}章/01_状态上下文.md，撰写本章完整正文。

      1. 镜头焊死在第一视角/限制视点，严格落实节拍表中的目标、冲突与恶化；

      2. 严格遵循【角色称谓白名单】，严禁直呼发小全名，严禁粗暴怒吼“闭嘴/给我闭嘴”，保持人物对话呼吸感与性格指纹；

      3. 人物言行与性格必须严密符合 设定/人物/ 中的档案，严禁突兀 OOC；

      4. 执行五感具身白描，动作有力，场景具有强烈实存感；

      5. 在正文末尾严格执行预设的悬念钩子断章收尾。'
    skills:
    - novel-style-narrator
    inputs:
    - 工作区/第{chapter_pad}章/01_状态上下文.md
    - 工作区/第{chapter_pad}章/01_5_分场节拍表.md
    - 设定/人物/
    - 设定/世界观/
    outputs:
    - 工作区/第{chapter_pad}章/02_正文初稿.md
    assert:
      min_words: 2500
      max_words: 4500
      forbidden_terms:
      - 闭嘴
      - 给我闭嘴
  deai_polish:
    kind: agent
    after:
    - draft_chapter
    model: gemini-3.8-flash-high
    role: 去 AI 味与文风校准专家
    prompt: '对照 资产/voice_sample.md 中的作者语言风格样本，运用【novel-deai-humanizer】对 工作区/第{chapter_pad}章/02_正文初稿.md 进行深度去 AI 味润色：

      1. 严格落实【朱雀对抗三层规范】：执行断崖式句长交替（CV ≥ 0.45，长白描句紧接 2~5 字短句），严防连续 3 句匀速；状态副词严控 ≤ 2.0/百字（消灭缓缓/微微/悄然）；

      2. 绝对格杀“不是A而是B”、“不仅是A更是B”二元否定与三段式排比；主动注入粗粝生理应激与感官摩擦锚点；

      3. 称谓与情绪动力学修正：清除不合时宜的直呼全名，清除狂暴怒吼“闭嘴”，修正为冷幽默接梗或战术动作；

      4. 若此前存在 工作区/第{chapter_pad}章/03_3_朱雀检测报告.md 且未通过门禁，严格依照报告中的【靶向重写错题集】定向粉碎扣分病灶；

      5. 严格遵守非破坏性删除保护红线，将改写后的高质量定稿直接写出到指定文件。'
    skills:
    - novel-deai-humanizer
    inputs:
    - 工作区/第{chapter_pad}章/02_正文初稿.md
    - 资产/voice_sample.md
    outputs:
    - 工作区/第{chapter_pad}章/03_去AI味润色稿.md
    assert:
      min_words: 2400
      forbidden_terms:
      - 闭嘴
      - 给我闭嘴
  check_zhuque:
    kind: command
    after:
    - deai_polish
    role: 朱雀 AI 检测与拟人化特征门禁
    run:
    - python
    - ../../shared/check_humanness.py
    - --input
    - 工作区/第{chapter_pad}章/03_去AI味润色稿.md
    - --output
    - 工作区/第{chapter_pad}章/03_3_朱雀检测报告.md
    - --min-score
    - '80'
    inputs:
    - 工作区/第{chapter_pad}章/03_去AI味润色稿.md
    outputs:
    - 工作区/第{chapter_pad}章/03_3_朱雀检测报告.md
    assert:
      min_score: 80
      score_field: overall
  zhuque_api_final:
    kind: command
    after:
    - check_zhuque
    role: 朱雀官方 API 终审门禁 (腾讯云 EdgeOne zhuque-text)
    run:
    - python
    - ../../shared/check_zhuque_api.py
    - --input
    - 工作区/第{chapter_pad}章/03_去AI味润色稿.md
    - --output
    - 工作区/第{chapter_pad}章/03_4_朱雀API终审报告.md
    - --min-score
    - '60'
    inputs:
    - 工作区/第{chapter_pad}章/03_去AI味润色稿.md
    outputs:
    - 工作区/第{chapter_pad}章/03_4_朱雀API终审报告.md
    assert:
      min_score: 60
      score_field: overall
  audit_persona:
    kind: agent
    after:
    - zhuque_api_final
    model: gemini-3.8-flash-high
    subagent_type: novel_persona_auditor
    role: 角色人设与行为边界稽查官
    prompt: '运用【novel-character-guardian】对 工作区/第{chapter_pad}章/03_去AI味润色稿.md 进行像素级人设、称谓与知情边界审查：

      - 主要角色言行是否严格符合 设定/人物/ 中的人设档案（严查 OOC）；

      - 知情边界审查：反向归因对白信息源，严查上帝视角偷渡未发生剧情；

      - 社交称谓与礼仪：检查角色互称是否得体，严查直呼发小全名或粗暴狂暴咆哮；

      - 跨章节物理事实一致性：伤势残缺、物品归属、时空位移是否连续自洽；

      - 对白节奏与人物描写充实度（对白占比是否在 25%~40% 黄金区间）。

      定位到具体句段给出修改建议，并在报告末尾严格输出一行格式：

      SCORES: {"overall": 90, "persona": 92, "addressing": 95, "epistemic_boundary": 95, "consistency": 90, "dialogue_balance": 88}'
    skills:
    - novel-character-guardian
    inputs:
    - 工作区/第{chapter_pad}章/03_去AI味润色稿.md
    - 设定/人物/
    - 设定/大纲/
    outputs:
    - 工作区/第{chapter_pad}章/03_5_人设审查报告.md
    assert:
      min_score: 80
      score_field: overall
      min_scores:
        overall: 80
        persona: 80
        addressing: 80
        epistemic_boundary: 80
  review_qc:
    kind: agent
    after:
    - audit_persona
    model: gemini-3.8-flash-high
    role: 小说主编与防吃书质检员
    prompt: '运用【novel-editorial-reviewer】对 工作区/第{chapter_pad}章/03_去AI味润色稿.md 进行逐段盲审质检：

      - 世界观硬法典核验：力量体系、因果铁律与物理常识是否符合 设定/世界观/（严查吃书）；

      - 商业追读力与水分评估：主线推进净值测算，严查水分占比超标；

      - 场景起伏度与章末断章悬念钩子强度；

      - 角色言行与称谓得体度（严查 OOC 与称谓粗暴）。

      定位到具体句段给出修改建议，并在报告末尾严格输出一行格式：

      SCORES: {"overall": 88, "lore": 92, "pacing": 86, "hook": 90, "ooc": 90, "addressing": 92}'
    skills:
    - novel-editorial-reviewer
    inputs:
    - 工作区/第{chapter_pad}章/03_去AI味润色稿.md
    - 设定/世界观/
    - 设定/人物/
    outputs:
    - 工作区/第{chapter_pad}章/04_盲审质检报告.md
    assert:
      min_score: 80
      score_field: overall
  author_accept:
    kind: human
    after:
    - review_qc
    ask: 请创作者审阅润色稿与审查打分，确认无误后点击放行入库为正式章节。
    inputs:
    - 工作区/第{chapter_pad}章/01_5_分场节拍表.md
    - 工作区/第{chapter_pad}章/03_去AI味润色稿.md
    - 工作区/第{chapter_pad}章/03_3_朱雀检测报告.md
    - 工作区/第{chapter_pad}章/03_4_朱雀API终审报告.md
    - 工作区/第{chapter_pad}章/03_5_人设审查报告.md
    - 工作区/第{chapter_pad}章/04_盲审质检报告.md
    outputs:
    - 正文/{volume_name}/第{chapter_pad}章_{chapter_title}.md
  novel_stats:
    kind: command
    after:
    - author_accept
    run:
    - python
    - ../../shared/novel_stats.py
    - --project
    - .
    - --chapter
    - 正文/{volume_name}/第{chapter_pad}章_{chapter_title}.md
    - --output
    - 工作区/第{chapter_pad}章/05_章节统计.json
    inputs:
    - 正文/{volume_name}/第{chapter_pad}章_{chapter_title}.md
    outputs:
    - 工作区/第{chapter_pad}章/05_章节统计.json
